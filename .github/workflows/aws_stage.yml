on:
  push:
    branches:
      - rel_**

# CRITICAL: Permissions required to request the OIDC JWT token
permissions:
  id-token: write   # Required for requesting the JWT
  contents: read    # Required for actions/checkout

name: Push image to ECR and force new ECS deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # 3. Authenticate with AWS via OIDC (pinned to v4.1.0)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@4 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::042277129213:role/Frontdesk-app-websocketStagingGithubActionsRole
          aws-region: us-west-2
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and redeploy
        uses: jaroldwong/ecr-push-and-ecs-deploy@v1.1
        with:
          ecr-registry: ${{ steps.login-ecr.outputs.registry }}
          ecr-repository: 'frontdesk-app-websocket-staging'
          ecs-cluster: 'LSITFrontDeskCluster'
          ecs-service: 'frontdesk-app-websocket-staging'
